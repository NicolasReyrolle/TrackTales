name: autoupdate

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: dependabot-autoupdate
  cancel-in-progress: false

jobs:
  autoupdate:
    name: autoupdate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPENDABOT_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update Dependabot branches
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require('./.github/scripts/update-dependabot.cjs')({ github, context, core });
