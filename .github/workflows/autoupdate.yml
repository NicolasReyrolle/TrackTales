name: autoupdate

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: dependabot-autoupdate
  cancel-in-progress: false

jobs:
  autoupdate:
    name: autoupdate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPENDABOT_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update Dependabot branches
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require('./.github/scripts/update-dependabot.cjs')({ github, context, core });

  dependency-release:
    name: Check for dependency releases
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check for an active release
        id: active
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'release.yml', status, per_page: 1,
              });
              if (data.total_count > 0) {
                core.info(`A release is ${status}; the next check will reconsider any updates.`);
                core.setOutput('active', 'true');
                return;
              }
            }
            core.setOutput('active', 'false');

      - name: Detect unreleased runtime dependency updates
        id: detect
        if: steps.active.outputs.active == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/detect-dependency-release.cjs')({ github, context, core });

      - name: Dispatch release
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: { automatic: 'true' },
            });
