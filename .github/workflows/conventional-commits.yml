name: Conventional Commits

on:
  push:
    branches:
      - "**"
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-commit-messages:
    runs-on: ubuntu-latest
    # For pull_request_target (used by Dependabot), restrict to Dependabot only.
    if: |
      github.event_name != 'pull_request_target' ||
      github.actor == 'dependabot[bot]'
    steps:
      # Dependabot auto-generates commit messages in Conventional Commits format.
      # No checkout or installation needed — just confirm and pass.
      - name: Dependabot commit messages use Conventional Commits format
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        run: |
          echo "Dependabot auto-generates commit messages in Conventional Commits format."
          echo "Commit message validation skipped for Dependabot PRs."

      - name: Checkout repository
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name != 'pull_request_target'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Commitizen
        if: github.event_name != 'pull_request_target'
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Validate commit messages (push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            default_branch="${{ github.event.repository.default_branch }}"
            git fetch origin "${default_branch}:refs/remotes/origin/${default_branch}"
            rev_range="refs/remotes/origin/${default_branch}..${{ github.sha }}"
          else
            rev_range="$before..${{ github.sha }}"
          fi

          checked=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if [ -z "$(git diff-tree --no-commit-id --name-only -r "$sha")" ]; then
              echo "Skipping empty commit: $sha"
              continue
            fi
            msg="$(git log -1 --pretty=%B "$sha")"
            cz check --message "$msg"
            checked=$((checked + 1))
          done < <(git rev-list --reverse "$rev_range")

          if [ "$checked" -eq 0 ]; then
            echo "No non-empty commits to validate in $rev_range"
          fi

      - name: Validate commit messages (pull request)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rev_range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          checked=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if [ -z "$(git diff-tree --no-commit-id --name-only -r "$sha")" ]; then
              echo "Skipping empty commit: $sha"
              continue
            fi
            msg="$(git log -1 --pretty=%B "$sha")"
            cz check --message "$msg"
            checked=$((checked + 1))
          done < <(git rev-list --reverse "$rev_range")

          if [ "$checked" -eq 0 ]; then
            echo "No non-empty commits to validate in $rev_range"
          fi
