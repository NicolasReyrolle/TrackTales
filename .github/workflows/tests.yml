name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # For pull_request_target (used by Dependabot), restrict to Dependabot only to avoid
    # running untrusted fork code with elevated permissions.
if: |
  github.event_name != 'pull_request_target' ||
  github.event.pull_request.user.login == 'dependabot[bot]'
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          # For pull_request_target events (Dependabot), default checkout is the base branch
          # (safe — no untrusted code is executed). Tests validate CI infrastructure stability.
          ref: ${{ github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip/setuptools/wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dev dependencies (lint/type-check Python only)
        if: matrix.python-version == '3.14'
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-asyncio pytest-cov ruff mypy
          fi

      - name: Install test dependencies (other Python versions)
        if: matrix.python-version != '3.14'
        run: |
          pip install pytest pytest-asyncio pytest-cov

      - name: Install runtime dependencies (if present)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install package in editable mode
        run: |
          pip install -e .

      - name: Lint with Ruff
        if: matrix.python-version == '3.14'
        run: |
          ruff format --check src tests
          ruff check src tests

      - name: Type-check with mypy
        if: matrix.python-version == '3.14'
        run: |
          mypy src tests

      - name: Run tests with coverage
        run: |
          # Running from the project root ensures pytest discovery
          pytest --cov=src --cov-report=term-missing -q tests/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: NicolasReyrolle/tracktales
